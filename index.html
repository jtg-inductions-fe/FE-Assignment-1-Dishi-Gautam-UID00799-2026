<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Travlog</title>
    </head>

    <body>
        <div class="hero__layout-gradient-bg"></div>

        <div class="hero__layout-gradient-bg"></div>

        <header class="header">
            <nav class="navbar">
                <button class="navbar__menu" aria-label="Open navigation menu">
                    <img
                        src="/assets/svgs/menu.svg"
                        alt=""
                        aria-hidden="true"
                    />
                </button>

                <a href="#" class="navbar__logo" aria-label="Travlog home">
                    <img src="/assets/svgs/logo.svg" alt="Travlog" />
                </a>

                <div class="navbar__links">
                    <a href="/" aria-current="page">Home</a>
                    <a href="/discover">Discover</a>
                    <a href="/special-deals">Special Deals</a>
                    <a href="/contact">Contact</a>
                </div>

                <div class="navbar__actions">
                    <a href="#" class="navbar__login">Log In</a>

                    <a href="#" class="navbar__signup button button--primary">
                        Sign Up
                    </a>
                </div>

                <button
                    class="navbar__menu"
                    type="button"
                    aria-label="Open navigation menu"
                    aria-expanded="false"
                    aria-controls="mobile-navigation"
                >
                    <img
                        class="navbar__menu-image"
                        src="/assets/svgs/menu.svg"
                        alt=""
                    />
                </button>
            </nav>

            <aside
                id="mobile-navigation"
                class="mobile-navigation"
                aria-label="Mobile navigation"
                aria-hidden="true"
            >
                <div class="mobile-navigation__header">
                    <span class="mobile-navigation__title">Menu</span>

                    <button
                        class="mobile-navigation__close"
                        type="button"
                        aria-label="Close navigation menu"
                    >
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <div class="mobile-navigation__links">
                    <a href="/" aria-current="page">Home</a>
                    <a href="/discover">Discover</a>
                    <a href="/special-deals">Special Deals</a>
                    <a href="/contact">Contact</a>
                </div>

                <div class="mobile-navigation__actions">
                    <a href="/login" class="button button--secondary">
                        Log In
                    </a>

                    <a href="/signup" class="button button--primary">
                        Sign Up
                    </a>
                </div>
            </aside>
        </header>

        <main>
            <section class="hero">
                <div class="hero__grid-container">
                    <div class="hero__visual">
                        <div class="hero__visual-inner">
                            <img
                                class="hero__layer"
                                src="/assets/images/layer.png"
                                alt=""
                                aria-hidden="true"
                            />

                        <img
                            class="hero__image hero__image--one"
                            src="/assets/images/destination-01.png"
                            alt="Beautiful seaside travel destination"
                        />

                        <img
                            class="hero__image hero__image--two"
                            src="/assets/images/destination-02.png"
                            alt="Mountain travel destination"
                        />

                        <img
                            class="hero__image hero__image--three"
                            src="/assets/images/destination-03.png"
                            alt="Traveler exploring a city"
                        />

                        <button
                            class="hero__float hero__float--follow"
                            type="button"
                            aria-label="Follow destination"
                        >
                            <img
                                src="/assets/svgs/follow.svg"
                                alt=""
                                aria-hidden="true"
                            />
                        </button>

                        <button
                            class="hero__float hero__float--places"
                            type="button"
                            aria-label="View top places"
                        >
                            <img
                                src="/assets/svgs/location.svg"
                                alt=""
                                aria-hidden="true"
                            />
                            <span>Top Places</span>
                        </button>

                        <button
                            class="hero__float hero__float--share"
                            type="button"
                            aria-label="Share destination"
                        >
                            <img
                                src="/assets/svgs/share.svg"
                                alt=""
                                aria-hidden="true"
                            />
                        </button>
                    </div>
                </div>

                        <div class="hero__content">
                            <div class="hero__eyebrow">
                                <span>Explore the world!</span>
                                <img
                                    src="/assets/svgs/work.svg"
                                    alt=""
                                    aria-hidden="true"
                                />
                            </div>

                            <h1 class="hero__title">
                                Travel
                                <span class="highlight"
                                    >top<br />destination</span
                                ><br />of the world
                            </h1>

                            <p class="hero__description">
                                We always make our customer happy by
                                providing<br />
                                as many choices as possible
                            </p>

                            <div class="hero__actions">
                                <button
                                    class="button button--primary"
                                    type="button"
                                >
                                    Get Started
                                </button>
                                <button
                                    class="button button--secondary"
                                    type="button"
                                >
                                    <img
                                        class="button__icon"
                                        src="/assets/svgs/play.svg"
                                        alt=""
                                        aria-hidden="true"
                                    />
                                    <span>Watch Demo</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="partner-logo">
                    <img src="/assets/svgs/tripadvisor.svg" alt="Tripadvisor" />
                    <img src="/assets/svgs/expedia.svg" alt="Expedia" />
                    <img src="/assets/svgs/booking.svg" alt="Booking.com" />
                    <img src="/assets/svgs/airbnb.svg" alt="Airbnb" />
                    <img src="/assets/svgs/orbitz.svg" alt="Orbitz" />
                </div>
            </section>
        </main>
    </body>
</html>
