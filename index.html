<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Travlog</title>
        <link rel="stylesheet" href="src/styles/main.scss" />
    </head>
    <body>
        <div class="hero__layout-gradient-bg"></div>

        <header class="header">
            <nav class="navbar">
                <button class="navbar__menu" aria-label="Open navigation menu">
                    <img
                        src="/assets/svgs/menu.svg"
                        alt=""
                        aria-hidden="true"
                    />
                </button>

                <a href="#" class="navbar__logo" aria-label="Travlog home">
                    <img src="/assets/svgs/logo.svg" alt="Travlog" />
                </a>

                <div class="navbar__links">
                    <a href="#" class="active">Home</a>
                    <a href="#">Discover</a>
                    <a href="#">Special Deals</a>
                    <a href="#">Contact</a>
                </div>

                <div class="navbar__actions">
                    <a href="#" class="navbar__login">Log In</a>
                    <a href="#" class="navbar__signup button button--primary"
                        >Sign Up</a
                    >
                </div>
            </nav>
        </header>

        <main>
            <section class="hero">
                <div class="hero__grid-container">
                    <div class="hero__visual">
                        <div class="hero__visual-inner">
                            <img
                                class="hero__layer"
                                src="/assets/images/layer.png"
                                alt=""
                                aria-hidden="true"
                            />

                            <div class="hero__images-grid">
                                <div class="hero__images-left">
                                    <img
                                        class="hero__image hero__image--one"
                                        src="/assets/images/destination_01.png"
                                        alt="Seaside destination"
                                    />
                                    <img
                                        class="hero__image hero__image--two"
                                        src="/assets/images/destination_02.png"
                                        alt="Mountain destination"
                                    />

                                    <div
                                        class="hero__float hero__float--follow"
                                    >
                                        <img
                                            class="hero__float-icon"
                                            src="/assets/svgs/share.svg"
                                            alt="Share"
                                        />
                                    </div>
                                </div>

                                <div class="hero__images-right">
                                    <img
                                        class="hero__image hero__image--three"
                                        src="/assets/images/destination_03.png"
                                        alt="Traveler exploring city"
                                    />

                                    <div
                                        class="hero__float hero__float--places"
                                    >
                                        <img
                                            class="hero__float-icon hero__float-icon--pin"
                                            src="/assets/svgs/location.svg"
                                            alt=""
                                            aria-hidden="true"
                                        />
                                        <span>Top Places</span>
                                    </div>

                                    <div class="hero__float hero__float--share">
                                        <img
                                            class="hero__float-icon"
                                            src="/assets/svgs/follow.svg"
                                            alt="Follow"
                                        />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="hero__content-wrap">
                        <!-- Left Side Orange Arrow Pattern Grid Using arrow.svg -->
                        <div class="hero__arrows-grid" aria-hidden="true">
                            <div class="hero__arrows-col">
                                <img src="/assets/svgs/arrow.svg" alt="" /><img
                                    src="/assets/svgs/arrow.svg"
                                    alt=""
                                /><img src="/assets/svgs/arrow.svg" alt="" />
                            </div>
                        </div>

                        <div class="hero__content">
                            <div class="hero__eyebrow">
                                <span>Explore the world!</span>
                                <img
                                    src="/assets/svgs/work.svg"
                                    alt=""
                                    aria-hidden="true"
                                />
                            </div>

                            <h1 class="hero__title">
                                Travel
                                <span class="highlight"
                                    >top<br />destination</span
                                ><br />of the world
                            </h1>

                            <p class="hero__description">
                                We always make our customer happy by
                                providing<br />
                                as many choices as possible
                            </p>

                            <div class="hero__actions">
                                <button
                                    class="button button--primary"
                                    type="button"
                                >
                                    Get Started
                                </button>
                                <button
                                    class="button button--secondary"
                                    type="button"
                                >
                                    <img
                                        class="button__icon"
                                        src="/assets/svgs/play.svg"
                                        alt=""
                                        aria-hidden="true"
                                    />
                                    <span>Watch Demo</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="partner-logo">
                    <img src="/assets/svgs/tripadvisor.svg" alt="Tripadvisor" />
                    <img src="/assets/svgs/expedia.svg" alt="Expedia" />
                    <img src="/assets/svgs/booking.svg" alt="Booking.com" />
                    <img src="/assets/svgs/airbnb.svg" alt="Airbnb" />
                    <img src="/assets/svgs/orbitz.svg" alt="Orbitz" />
                </div>
            </section>
        </main>
    </body>
</html>
