<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Travlog</title>
        <link rel="stylesheet" href="src/styles/main.scss" />
    </head>
    <body>
        <header class="header">
            <nav class="navbar">
                <a href="#" class="navbar__logo" aria-label="Travlog home">
                    <img src="/assets/svgs/logo.svg" alt="Travlog" />
                </a>

                <div class="navbar__links">
                    <a href="#">Home</a>
                    <a href="#">Discover</a>
                    <a href="#">Special Deals</a>
                    <a href="#">Contact</a>
                </div>

                <div class="navbar__actions">
                    <a href="#" class="navbar__login">Log In</a>
                    <a href="#" class="navbar__signup button button--primary">
                        Sign Up
                    </a>
                </div>

                <button
                    class="navbar__menu"
                    type="button"
                    aria-label="Open navigation menu"
                >
                    <i class="icon-th-menu"></i>
                </button>
            </nav>
        </header>

        <main>
            <div>Hello World</div>
            <a class="button button--primary" href="#start">Get Started</a>

            <section id="start">
                <!-- Start content -->
                <div class="stats">
                    <div class="card">
                        <span class="card__value">500+</span>
                        <span class="card__label">Holiday Package</span>
                    </div>

                    <div class="card">
                        <span class="card__value">100</span>
                        <span class="card__label">Luxury Hotel</span>
                    </div>

                    <div class="card">
                        <span class="card__value">7</span>
                        <span class="card__label">Premium Airlines</span>
                    </div>

                    <div class="card">
                        <span class="card__value">2k+</span>
                        <span class="card__label">Happy Customer</span>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
