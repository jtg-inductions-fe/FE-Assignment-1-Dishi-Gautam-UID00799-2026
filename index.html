<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Travlog</title>
        <link rel="stylesheet" href="src/styles/main.scss" />
    </head>
    <body>
        <header class="header">
            <nav class="navbar">
                <a href="#" class="navbar__logo" aria-label="Travlog home">
                    <img src="/assets/svgs/logo.svg" alt="Travlog" />
                </a>
                <div class="navbar__links">
                    <a href="#">Home</a>
                    <a href="#">Discover</a>
                    <a href="#">Special Deals</a>
                    <a href="#">Contact</a>
                </div>
                <div class="navbar__actions">
                    <a href="#" class="navbar__login">Log In</a>
                    <a href="#" class="navbar__signup button button--primary">
                        Sign Up
                    </a>
                </div>
                <button class="navbar__menu" aria-label="Open navigation menu">
                    <img src="/assets/svgs/menu.svg" alt="Menu" />
                </button>
            </nav>
        </header>

        <main>
            <section class="hero">
                <div class="hero__visual">
                    <div class="hero__visual-inner">
                        <img
                            class="hero__layer"
                            src="/assets/images/layer.png"
                            alt=""
                            aria-hidden="true"
                        />

                        <img
                            class="hero__image hero__image--one"
                            src="/assets/images/destination_01.png"
                            alt="Beautiful seaside travel destination"
                        />

                        <img
                            class="hero__image hero__image--two"
                            src="/assets/images/destination_02.png"
                            alt="Mountain travel destination"
                        />

                        <img
                            class="hero__image hero__image--three"
                            src="/assets/images/destination_03.png"
                            alt="Traveler exploring a city"
                        />

                        <button
                            class="hero__float hero__float--follow"
                            type="button"
                            aria-label="Follow destination"
                        >
                            <img
                                src="/assets/svgs/follow.svg"
                                alt=""
                                aria-hidden="true"
                            />
                        </button>

                        <button
                            class="hero__float hero__float--places"
                            type="button"
                            aria-label="View top places"
                        >
                            <img
                                src="/assets/svgs/location.svg"
                                alt=""
                                aria-hidden="true"
                            />
                            <span>Top Places</span>
                        </button>

                        <button
                            class="hero__float hero__float--share"
                            type="button"
                            aria-label="Share destination"
                        >
                            <img
                                src="/assets/svgs/share.svg"
                                alt=""
                                aria-hidden="true"
                            />
                        </button>
                    </div>
                </div>

                <div class="hero__content">
                    <p class="hero__eyebrow">
                        <span>Explore the world!</span>
                        <img
                            src="/assets/svgs/work.svg"
                            alt=""
                            aria-hidden="true"
                        />
                    </p>

                    <h1>Travel <span>top destination</span> of the world</h1>

                    <p class="hero__description">
                        We always make our customer happy by providing as many
                        choices as possible
                    </p>

                    <div class="hero__actions">
                        <button class="button button--primary" type="button">
                            Get Started
                        </button>

                        <button class="button button--secondary" type="button">
                            <img
                                class="button__icon"
                                src="/assets/svgs/play.svg"
                                alt=""
                                aria-hidden="true"
                            />

                            <span>Watch Demo</span>
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
