<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Travlog</title>
    </head>

    <body>
        <header class="header">
            <nav class="navbar" aria-label="Main navigation">
                <a
                    href="/"
                    class="navbar__logo"
                    aria-label="Travlog home"
                >
                    <img
                        class="navbar__logo-image"
                        src="/assets/svgs/logo.svg"
                        alt=""
                    />
                </a>

                <div class="navbar__links">
                    <a href="/" aria-current="page">Home</a>
                    <a href="/discover">Discover</a>
                    <a href="/special-deals">Special Deals</a>
                    <a href="/contact">Contact</a>
                </div>

                <div class="navbar__actions">
                    <a
                        href="/login"
                        class="navbar__login button button--secondary"
                    >
                        Log In
                    </a>

                    <a
                        href="/signup"
                        class="navbar__signup button button--primary"
                    >
                        Sign Up
                    </a>
                </div>

                <button
                    class="navbar__menu"
                    type="button"
                    aria-label="Open navigation menu"
                    aria-expanded="false"
                >
                    <img
                        class="navbar__menu-image"
                        src="/assets/svgs/menu.svg"
                        alt=""
                    />
                </button>

                <div class="navbar__mobile-menu">
                    <div class="navbar__mobile-header">
                        <span class="navbar__mobile-title">Menu</span>

                        <button
                            class="navbar__mobile-close"
                            type="button"
                            aria-label="Close navigation menu"
                        >
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>

                    <div class="navbar__mobile-links">
                        <a href="/" aria-current="page">Home</a>
                        <a href="/discover">Discover</a>
                        <a href="/special-deals">Special Deals</a>
                        <a href="/contact">Contact</a>
                    </div>

                    <div class="navbar__mobile-actions">
                        <a
                            href="/login"
                            class="button button--secondary"
                        >
                            Log In
                        </a>

                        <a
                            href="/signup"
                            class="button button--primary"
                        >
                            Sign Up
                        </a>
                    </div>
                </div>
            </nav>
        </header>

        <script type="module" src="/src/script/index.js"></script>
    </body>
</html>
