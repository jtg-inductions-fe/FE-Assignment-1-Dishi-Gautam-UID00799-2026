<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <meta
            name="description"
            content="Travlog - Discover amazing destinations and special travel deals."
        />
        <meta
            name="keywords"
            content="travel, destinations, vacation, travel deals, Travlog"
        />
        <meta name="author" content="Dishi Gautam" />
        <meta name="robots" content="index, follow" />

        <title>Travlog - Explore the World</title>
    </head>

    <body>
        <nav class="navbar" aria-label="Main navigation">
            <button
                class="navbar__menu"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="mobile-navigation"
            >
                <img
                    class="navbar__menu-image"
                    src="/assets/svgs/menu.svg"
                    alt=""
                    aria-hidden="true"
                />
            </button>

            <a href="/" class="navbar__logo" aria-label="Travlog home">
                <img
                    class="navbar__logo-image"
                    src="/assets/svgs/logo.svg"
                    alt="Travlog"
                />
            </a>

            <div
                id="mobile-navigation"
                class="navbar__mobile-menu"
                aria-hidden="true"
            >
                <div class="navbar__mobile-header">
                    <span class="navbar__mobile-title"> Menu </span>

                    <button
                        class="navbar__mobile-close"
                        type="button"
                        aria-label="Close navigation menu"
                    >
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <div class="navbar__links">
                    <a href="/" class="navbar__link" aria-current="page"
                        >Home</a
                    >
                    <a href="/discover" class="navbar__link">Discover</a>
                    <a href="/special-deals" class="navbar__link"
                        >Special Deals</a
                    >
                    <a href="/contact" class="navbar__link">Contact</a>
                </div>
            </div>

            <div class="navbar__actions">
                <a href="/login" class="navbar__login button button--tertiary">
                    Log In
                </a>

                <a href="/signup" class="navbar__signup button button--primary">
                    Sign Up
                </a>
            </div>
        </nav>

        <script type="module" src="/src/script/index.js"></script>
    </body>
</html>
